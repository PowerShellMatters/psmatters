baseURL: https://powershellmatters.com/
title: PowerShell Matters
disableKinds: [taxonomy]
theme: ['@docsy/theme']
themesDir: node_modules
enableGitInfo: false
enableEmoji: true
ignoreLogs:
  - warning-goldmark-raw-html
mainSections:
  - docs
  - blog
timeout: 30s
timezone: America/Chicago
titleCaseStyle: firstupper

module:
  proxy: direct
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/docsy/docsy/theme
      disable: false

outputs:
  docs: [HTML, markdown, rss, LLMS]
  blog: [HTML, markdown, rss, LLMS]
  section: [HTML, markdown]

markup:
  goldmark:
    extensions:
      linkify: false
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode
    style: vulcan
  tableOfContents: { endLevel: 4 }

imaging:
  resampleFilter: CatmullRom # cspell:disable-line
  anchor: Smart

params:
  copyright:
    authors: >-
      Sean D. Wheeler | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0)
    from_year: 2026
    # to_year: 2026
  offlineSearch: true
  ui:
    feedback:
      enable: false
    navbar_logo: true
    showLightDarkModeMenu: true
    sidebar_cache_limit: 100
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    ul_show: 1

  # Text macros: use with _param
  btn-lg: class="btn btn-lg btn-{1}" role="button"
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>

  links: # CUSTOMIZE
    user:
      #- email: swsamwa@live.com
      - name: GitHub Profile
        url: https://github.com/PowerShellMatters
        icon: fa-brands fa-github
    developer:
      - name: RSS feed
        url: /index.xml
        icon: fa-solid fa-rss
        desc: RSS feed
      - name: GitHub
        url: https://github.com/sdwheeler/seanonit
        icon: fa-brands fa-github
        desc: GitHub repository for this site
